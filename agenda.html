<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="assets/css/style.css">
    <title>Agenda web</title>
</head>

<body>
    <section class="container-fluid">
        <nav class="navbar navbar-expand-lg navbar-dark mt-1">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="index.html">Inicio</a>

    <header class="title-conteiner">
        <h1>Agenda de Contactos</h1>
    </header>

    <section class="agregar" aria-label="Agregar contacto">
        <h2>Agregar Nuevo Contacto</h2>
        <form id="formAgregar">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" required>

            <label for="email">Email:</label>
            <input type="email" id="email" required>

            <label for="telefono">Teléfono:</label>
            <input type="text" id="telefono" required>

            <button type="submit" id="btnAgregar">Agregar Contacto</button>
        </form>
    </section>

    <section aria-label="Lista de contactos">
        <h2>Contactos</h2>
        <table id="tablaContactos">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Teléfono</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </section>
</body>
<script src="assets/js/agenda.js"></script>

</html>
